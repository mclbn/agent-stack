# The heavy half of the golden: the editor, the display stack and the document
# toolchain. Roughly 15 GB of the 20-25 GB total, dominated by texlive-meta at
# 6-8 GB.
#
# Selected by site.nix's guest.profile. The light profile omits all of it,
# which gives a sandbox that can still build, run and debug code, talk to
# databases and run containers — everything except editing in Emacs over VNC
# and producing documents. Useful while iterating on the stack itself, where a
# 1 GB image that builds in minutes beats a 20 GB one that does not.
[Content]
Packages=
        # Editor. emacs-lsp-booster comes from the AUR, built on L0 and
        # supplied through mkosi.packages/; see site.nix guest.aurPackages.
        emacs
        emacs-lsp-booster
        enchant
        hunspell
        hunspell-en_us
        hunspell-fr-comprehensive
        libvterm
        poppler-glib
        libgccjit
        tree-sitter
        tree-sitter-grammars
        xclip
        ttf-nerd-fonts-symbols
        noto-fonts
        noto-fonts-emoji

        # Display
        tigervnc
        i3-wm
        dmenu
        xorg-xsetroot

        # Media and docs
        pandoc
        ffmpeg
        imagemagick
        graphviz
        plantuml
        texlive-meta
        biber
        python-pygments

        # Fonts
        ttf-dejavu
        nerd-fonts
        noto-fonts
        noto-fonts-cjk
        noto-fonts-emoji
