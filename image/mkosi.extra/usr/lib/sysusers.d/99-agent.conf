# The agent user, uid 1000 end to end: the operator's uid on L0, the project
# user on L1, the agent in L2. No uid mapping anywhere.
#
# The group is declared on its own line. A numeric "u agent 1000:1000" does
# not create the group — sysusers requires a numeric gid to already exist — so
# the user line was silently skipped and no agent account appeared.
g agent 1000
u agent 1000:agent "agent" /home/agent /bin/bash

# Docker's socket is root:docker, so without this every docker command fails
# with "permission denied while trying to connect to the docker API".
#
# Numbered 99 so systemd-sysusers reads it last: these directories are
# processed in lexicographic order, and the docker group may be created by
# docker's own sysusers file. An "m" line naming a group that does not exist
# yet is skipped, silently. The same convention as 00-agent.preset, which is
# numbered to be read *before* the distribution's presets.
m agent docker
