# Golden sandbox image — slice 2a, minimal and bootable.
#
# Boot layout: GPT with a 1 MB BIOS boot partition and an ESP, GRUB i386-pc,
# booted by SeaBIOS. Not the MBR the specification names: mkosi stores the
# kernel, initrd and grub modules on the ESP even when no EFI bootloader is
# installed, so a pure MBR layout is off its path entirely. The property being
# bought is unchanged — no per-VM firmware state, nothing to orphan.

[Distribution]
Distribution=arch
# The Arch Linux Archive pin comes from site.nix (guest.snapshot), passed on
# the command line by golden-build, so that every "what goes in the image"
# knob lives in one file. Bump it with `nix run '.#golden-update'`.
# Defaults to yes only on Ubuntu hosts. Without it, nothing ever downloads
# archlinux-keyring and `pacman-key --populate` finds no keys to import.
RepositoryKeyFetch=yes

[Output]
Format=disk
ImageId=agent-golden

[Content]
Bootable=yes
Bootloader=none
BiosBootloader=grub
KernelCommandLine=console=tty0 console=ttyS0,115200 rw
# Agents run pacman -S inside the sandbox between image rebuilds, so the
# package database has to survive into the image.
CleanPackageMetadata=no

# Without these, systemd-firstboot finds an unconfigured system and prompts
# interactively on the console, which a sandbox can never answer. Machine ID is
# deliberately left out: it defaults to uninitialized, so each sandbox
# generates its own at first boot rather than inheriting one from the golden.
RootPassword=hashed:
RootShell=/bin/bash
Locale=en_US.UTF-8
Keymap=us
Timezone=UTC
Hostname=sandbox

Packages=
        # Base
        base
        linux
        grub
        base-devel
        git
        curl
        wget
        jq
        yq
        ripgrep
        fd
        sd
        bat
        tree
        rsync
        moreutils
        parallel
        entr
        direnv
        unzip
        zip
        p7zip
        openssh
        chrony
        ca-certificates
        sudo
        which
        less
        # Editors, in the base list so the light image has one too. Arch's
        # `vi` is traditional vi/ex, not vim. Emacs is profile-dependent and
        # needs a display; these are for a quick edit over ssh and for anything
        # that falls back to $EDITOR.
        vi
        nano

        # Build and debug
        clang
        cmake
        meson
        ninja
        pkgconf
        autoconf
        automake
        gdb
        strace
        ltrace

        # Languages
        nodejs
        npm
        corepack
        python
        python-pipx
        uv
        rust
        go
        ruby
        lua
        jdk-openjdk
        mise

        # Language servers and formatters, so eglot works in a fresh sandbox
        pyright
        typescript-language-server
        gopls
        rust-analyzer
        bash-language-server
        ruff
        prettier
        shfmt
        shellcheck

        # Network. Deliberately excludes nmap.
        httpie
        socat
        openbsd-netcat
        bind-tools
        openssl
        tcpdump
        mtr

        # Database clients only; servers run as containers
        postgresql-libs
        mariadb-clients
        redis

        # Containers
        docker
        docker-compose

        # Shell and multiplexer; the agents themselves are installed into
        # /home/agent by mkosi.postinst so that self-update lands on the
        # overlay rather than failing against a read-only system path.
        tmux
        zsh

        # AUR helper, built on L0 and supplied through mkosi.packages/
        yay
